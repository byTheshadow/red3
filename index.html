<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>咖啡谏言 · Daily Coffee Whispers</title>

  <style>
    :root {
      --bg-color: #F4F0EA;
      --card-bg: #EAE3D9;
      --text-main: #2C2A29;
      --text-sub: #7C736A;
      --line-soft: rgba(44, 42, 41, 0.16);

      --coffee-dark: #4A332A;
      --coffee-mid: #8B5E3C;
      --coffee-light: #C4B29E;

      --font-serif: "Songti SC", "Noto Serif SC", "Source Han Serif SC", "STSong", "Georgia", serif;

      --liquid-color: #6B4634;
      --liquid-opacity: 0.86;
      --milk-color: #E7D8C2;
      --crema-color: #C9965A;

      --cup-width: 118px;
      --cup-height: 168px;
      --liquid-height: 68%;

      --mood-color: rgba(139, 94, 60, 0.16);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-serif);
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    button {
      font-family: inherit;
    }

    .app-container {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      max-height: 932px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 24%, rgba(255,255,255,0.48), transparent 38%),
        radial-gradient(circle at 50% 68%, rgba(217,199,174,0.28), transparent 54%),
        var(--bg-color);
      box-shadow: 0 20px 60px rgba(0,0,0,0.04);
    }

    .screen {
      position: absolute;
      inset: 0;
      padding: 56px 24px 42px;
      display: flex;
      flex-direction: column;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .screen.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px);
    }

    /* Opening */

    .opening-screen {
      justify-content: space-between;
      align-items: center;
      text-align: center;
    }

    .date-header {
      opacity: 0;
      animation: fadeIn 1.1s ease 0.2s forwards;
    }

    .date-main {
      font-size: 14px;
      letter-spacing: 0.25em;
    }

    .date-sub {
      margin-top: 6px;
      font-size: 11px;
      letter-spacing: 0.32em;
      color: var(--text-sub);
    }

    .canvas-stage {
      position: relative;
      width: 240px;
      height: 240px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .ink-bloom {
      position: absolute;
      width: 126px;
      height: 126px;
      border-radius: 47% 53% 62% 38% / 48% 62% 38% 52%;
      background: radial-gradient(circle, rgba(74,51,42,0.76) 0%, rgba(143,119,101,0.34) 44%, rgba(244,240,234,0) 76%);
      filter: blur(8px);
      opacity: 0;
      transform: scale(0.32);
      animation: bloomFade 3.4s ease-out 1.5s forwards, slowDrift 18s ease-in-out 4s infinite alternate;
    }

    .ink-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .drop {
      fill: var(--coffee-dark);
      animation: dropFall 1.2s cubic-bezier(0.55, 0.085, 0.68, 0.53) 0.45s forwards;
    }

    .ripple-1,
    .ripple-2 {
      fill: none;
      transform-origin: center;
      opacity: 0;
    }

    .ripple-1 {
      stroke: var(--coffee-dark);
      stroke-width: 1.4;
      animation: rippleExpand 2s ease-out 1.45s infinite;
    }

    .ripple-2 {
      stroke: var(--coffee-light);
      stroke-width: 1;
      animation: rippleExpand 2.4s ease-out 1.9s infinite;
    }

    .footer-action {
      opacity: 0;
      animation: fadeIn 1.1s ease 2.1s forwards;
    }

    .whisper-subtitle {
      font-size: 14px;
      line-height: 1.85;
      letter-spacing: 0.2em;
      color: var(--text-sub);
      margin-bottom: 30px;
    }

    .primary-btn {
      border: 1px solid rgba(44,42,41,0.72);
      background: transparent;
      color: var(--text-main);
      border-radius: 999px;
      padding: 12px 34px;
      font-size: 13px;
      letter-spacing: 0.28em;
      cursor: pointer;
      transition: 0.35s ease;
    }

    .primary-btn:active {
      transform: scale(0.97);
      background: var(--text-main);
      color: var(--bg-color);
    }

    /* Builder */

    .builder-screen {
      justify-content: space-between;
    }

    .builder-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
    }

    .step-kicker {
      font-size: 10px;
      letter-spacing: 0.32em;
      color: var(--text-sub);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .step-title {
      font-size: 24px;
      font-weight: 400;
      letter-spacing: 0.08em;
      line-height: 1.25;
    }

    .step-desc {
      margin-top: 8px;
      font-size: 12px;
      line-height: 1.7;
      color: var(--text-sub);
      letter-spacing: 0.08em;
    }

    .step-count {
      font-size: 12px;
      color: var(--text-sub);
      letter-spacing: 0.2em;
      white-space: nowrap;
      padding-top: 4px;
    }

    .coffee-stage {
      position: relative;
      flex: 1;
      min-height: 320px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .mood-orb {
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--mood-color), transparent 64%);
      filter: blur(8px);
      transition: background 0.7s ease;
    }

    .coffee-visual {
      position: relative;
      width: 220px;
      height: 260px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

    .steam-wrap {
      position: absolute;
      top: 8px;
      left: 50%;
      width: 120px;
      height: 90px;
      transform: translateX(-50%);
      opacity: 0;
      transition: opacity 0.5s ease;
      pointer-events: none;
    }

    .coffee-visual.show-steam .steam-wrap {
      opacity: 1;
    }

    .steam {
      position: absolute;
      bottom: 0;
      width: 1px;
      height: 56px;
      background: linear-gradient(to top, rgba(92,64,51,0), rgba(92,64,51,0.32), rgba(92,64,51,0));
      border-radius: 999px;
      filter: blur(0.4px);
      animation: steamRise 3.2s ease-in-out infinite;
    }

    .steam-1 { left: 34px; animation-delay: 0s; }
    .steam-2 { left: 58px; animation-delay: 0.7s; height: 68px; }
    .steam-3 { left: 82px; animation-delay: 1.2s; }

    .cup {
      position: relative;
      width: var(--cup-width);
      height: var(--cup-height);
      border: 1px solid rgba(44,42,41,0.32);
      border-top: none;
      border-radius: 0 0 34px 34px;
      overflow: hidden;
      background: rgba(255,255,255,0.12);
      box-shadow:
        inset 0 0 18px rgba(255,255,255,0.32),
        0 18px 44px rgba(80,58,42,0.08);
      transition:
        width 0.7s ease,
        height 0.7s ease,
        border-radius 0.7s ease;
    }

    .cup::before {
      content: "";
      position: absolute;
      left: -1px;
      top: -9px;
      width: calc(100% + 2px);
      height: 18px;
      border: 1px solid rgba(44,42,41,0.28);
      border-radius: 50%;
      background: rgba(244,240,234,0.22);
      z-index: 5;
    }

    .cup.espresso {
      border-radius: 0 0 28px 28px;
    }

    .cup.tall {
      border-radius: 0 0 30px 30px;
    }

    .liquid {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: var(--liquid-height);
      background:
        linear-gradient(to bottom, rgba(255,255,255,0.12), transparent 24%),
        var(--liquid-color);
      opacity: var(--liquid-opacity);
      transition:
        height 0.7s ease,
        background 0.7s ease,
        opacity 0.7s ease;
    }

    .liquid::before {
      content: "";
      position: absolute;
      top: -8px;
      left: -5%;
      width: 110%;
      height: 18px;
      border-radius: 50%;
      background: rgba(255,255,255,0.13);
      animation: liquidBreath 4s ease-in-out infinite;
    }

    .crema {
      position: absolute;
      left: 8%;
      bottom: calc(var(--liquid-height) - 7px);
      width: 84%;
      height: 14px;
      border-radius: 50%;
      background: var(--crema-color);
      opacity: 0;
      filter: blur(0.2px);
      transition: opacity 0.5s ease, bottom 0.7s ease, background 0.7s ease;
      z-index: 3;
    }

    .coffee-visual.show-crema .crema {
      opacity: 0.82;
    }

    .milk-layer {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 48%;
      background:
        radial-gradient(circle at 34% 20%, rgba(255,255,255,0.42), transparent 22%),
        var(--milk-color);
      opacity: 0;
      transition: opacity 0.5s ease, background 0.7s ease;
      mix-blend-mode: screen;
      z-index: 2;
    }

    .coffee-visual.show-milk .milk-layer {
      opacity: 0.72;
      animation: milkSwirl 5s ease-in-out infinite alternate;
    }

    .ice {
      position: absolute;
      width: 30px;
      height: 24px;
      border: 1px solid rgba(255,255,255,0.62);
      background: rgba(255,255,255,0.24);
      border-radius: 7px;
      opacity: 0;
      backdrop-filter: blur(3px);
      z-index: 4;
      transition: opacity 0.5s ease;
      animation: iceFloat 4s ease-in-out infinite;
    }

    .coffee-visual.show-ice .ice {
      opacity: 1;
    }

    .ice-1 { left: 32%; bottom: 42%; transform: rotate(-14deg); animation-delay: 0s; }
    .ice-2 { left: 50%; bottom: 30%; transform: rotate(18deg); animation-delay: 0.7s; }
    .ice-3 { left: 39%; bottom: 56%; transform: rotate(7deg); animation-delay: 1.3s; }

    .bubble {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.66);
      opacity: 0;
      z-index: 4;
      animation: bubbleRise 3.3s linear infinite;
    }

    .coffee-visual.show-bubbles .bubble {
      opacity: 0.85;
    }

    .bubble-1 { left: 37%; bottom: 20%; animation-delay: 0s; }
    .bubble-2 { left: 57%; bottom: 18%; animation-delay: 0.8s; }
    .bubble-3 { left: 48%; bottom: 25%; animation-delay: 1.6s; }

    .topping {
      position: absolute;
      left: 50%;
      bottom: calc(var(--liquid-height) + 4px);
      width: 86px;
      height: 24px;
      transform: translateX(-50%);
      opacity: 0;
      transition: opacity 0.5s ease, bottom 0.7s ease;
      z-index: 6;
      pointer-events: none;
    }

    .coffee-visual.show-petals .topping,
    .coffee-visual.show-citrus .topping,
    .coffee-visual.show-salt .topping {
      opacity: 1;
    }

    .coffee-visual.show-petals .topping {
      background:
        radial-gradient(circle at 18% 42%, #C89B4A 0 2px, transparent 3px),
        radial-gradient(circle at 38% 30%, #D6AD5D 0 1.8px, transparent 3px),
        radial-gradient(circle at 62% 50%, #C89B4A 0 2px, transparent 3px),
        radial-gradient(circle at 79% 38%, #D6AD5D 0 1.8px, transparent 3px);
    }

    .coffee-visual.show-salt .topping {
      background:
        radial-gradient(circle at 22% 50%, rgba(255,255,255,0.86) 0 1.5px, transparent 2.4px),
        radial-gradient(circle at 48% 42%, rgba(255,255,255,0.72) 0 1.5px, transparent 2.4px),
        radial-gradient(circle at 70% 54%, rgba(255,255,255,0.82) 0 1.5px, transparent 2.4px);
    }

    .coffee-visual.show-citrus .topping::before {
      content: "";
      position: absolute;
      left: 31px;
      top: 4px;
      width: 26px;
      height: 12px;
      border: 2px solid #C77932;
      border-bottom: none;
      border-radius: 26px 26px 0 0;
      transform: rotate(-8deg);
    }

    .saucer {
      position: absolute;
      bottom: -10px;
      width: calc(var(--cup-width) + 54px);
      height: 18px;
      border-radius: 50%;
      border: 1px solid rgba(44,42,41,0.12);
      background: rgba(255,255,255,0.16);
      transition: width 0.7s ease;
    }

    .options-panel {
      padding-bottom: 6px;
    }

    .option-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 22px;
    }

    .option-card {
      border: 1px solid rgba(44,42,41,0.14);
      background: rgba(234,227,217,0.5);
      border-radius: 18px;
      padding: 14px 13px 13px;
      text-align: left;
      cursor: pointer;
      color: var(--text-main);
      transition: 0.28s ease;
      min-height: 78px;
    }

    .option-card.active {
      border-color: rgba(44,42,41,0.58);
      background: rgba(255,255,255,0.26);
      box-shadow: 0 10px 24px rgba(80,58,42,0.06);
      transform: translateY(-2px);
    }

    .option-label {
      font-size: 14px;
      letter-spacing: 0.08em;
      line-height: 1.3;
    }

    .option-subtitle {
      margin-top: 7px;
      font-size: 11px;
      line-height: 1.55;
      letter-spacing: 0.06em;
      color: var(--text-sub);
    }

    .builder-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .ghost-btn {
      border: none;
      background: transparent;
      color: var(--text-sub);
      font-size: 12px;
      letter-spacing: 0.18em;
      padding: 10px 0;
      cursor: pointer;
    }

    .next-btn {
      margin-left: auto;
      border: 1px solid rgba(44,42,41,0.6);
      background: transparent;
      color: var(--text-main);
      border-radius: 999px;
      padding: 11px 26px;
      font-size: 12px;
      letter-spacing: 0.22em;
      cursor: pointer;
    }

    .next-btn:disabled {
      opacity: 0.32;
      cursor: default;
    }

    /* Animations */

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes dropFall {
      0% { transform: translateY(-116px); opacity: 0; }
      50% { opacity: 1; }
      90% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(0); opacity: 0; }
    }

    @keyframes rippleExpand {
      0% { transform: scale(0.2); opacity: 0.74; }
      100% { transform: scale(2.15); opacity: 0; }
    }

    @keyframes bloomFade {
      0% { opacity: 0; transform: scale(0.32); }
      48% { opacity: 0.64; transform: scale(1.08); }
      100% { opacity: 0.44; transform: scale(1); }
    }

    @keyframes slowDrift {
      0% { transform: scale(1) rotate(0deg); border-radius: 47% 53% 62% 38% / 48% 62% 38% 52%; }
      100% { transform: scale(1.05) rotate(18deg); border-radius: 58% 42% 45% 55% / 43% 54% 46% 57%; }
    }

    @keyframes steamRise {
      0% { transform: translateY(16px) scaleY(0.8); opacity: 0; }
      35% { opacity: 0.72; }
      100% { transform: translateY(-26px) scaleY(1.2); opacity: 0; }
    }

    @keyframes liquidBreath {
      0%, 100% { transform: translateX(-2px) scaleX(1); }
      50% { transform: translateX(2px) scaleX(1.04); }
    }

    @keyframes milkSwirl {
      0% { filter: blur(0px); transform: translateY(0); }
      100% { filter: blur(1px); transform: translateY(-3px); }
    }

    @keyframes iceFloat {
      0%, 100% { margin-bottom: 0; }
      50% { margin-bottom: 7px; }
    }

    @keyframes bubbleRise {
      0% { transform: translateY(0) scale(0.8); opacity: 0; }
      20% { opacity: 0.9; }
      100% { transform: translateY(-76px) scale(1.15); opacity: 0; }
    }
  </style>
</head>

<body>
  <div class="app-container">

    <!-- Opening -->
    <section class="screen opening-screen" id="openingScreen">
      <header class="date-header">
        <div class="date-main" id="dateMain">2026.08.20</div>
        <div class="date-sub" id="dateSub">THURSDAY</div>
      </header>

      <main class="canvas-stage">
        <div class="ink-bloom"></div>
        <svg class="ink-svg" viewBox="0 0 200 200">
          <circle class="drop" cx="100" cy="100" r="4.5"></circle>
          <circle class="ripple-1" cx="100" cy="100" r="40"></circle>
          <circle class="ripple-2" cx="100" cy="100" r="40"></circle>
        </svg>
      </main>

      <footer class="footer-action">
        <p class="whisper-subtitle">萃取今日的情绪<br />调配一杯专属谏言</p>
        <button class="primary-btn" id="startBtn">开启调配</button>
      </footer>
    </section>

    <!-- Builder -->
    <section class="screen builder-screen hidden" id="builderScreen">
      <header class="builder-top">
        <div>
          <div class="step-kicker" id="stepKicker">Step 01</div>
          <h1 class="step-title" id="stepTitle">选择今日豆子</h1>
          <p class="step-desc" id="stepDesc">先决定这杯咖啡的底色。明亮、沉稳，或柔和。</p>
        </div>
        <div class="step-count" id="stepCount">1 / 5</div>
      </header>

      <main class="coffee-stage">
        <div class="mood-orb"></div>

        <div class="coffee-visual" id="coffeeVisual">
          <div class="steam-wrap">
            <div class="steam steam-1"></div>
            <div class="steam steam-2"></div>
            <div class="steam steam-3"></div>
          </div>

          <div class="saucer"></div>

          <div class="cup" id="cup">
            <div class="liquid"></div>
            <div class="milk-layer"></div>
            <div class="crema"></div>

            <div class="ice ice-1"></div>
            <div class="ice ice-2"></div>
            <div class="ice ice-3"></div>

            <div class="bubble bubble-1"></div>
            <div class="bubble bubble-2"></div>
            <div class="bubble bubble-3"></div>

            <div class="topping"></div>
          </div>
        </div>
      </main>

      <footer class="options-panel">
        <div class="option-grid" id="optionGrid"></div>

        <div class="builder-nav">
          <button class="ghost-btn" id="prevBtn">上一项</button>
          <button class="next-btn" id="nextBtn">下一项</button>
        </div>
      </footer>
    </section>
  </div>

  <script>
    /**
     * =====================================================
     * 1. 选项数据库
     * 后续可以让其他 AI 继续填充。
     * 每个选项都可以带 traits 和 visual。
     * traits 用于之后匹配谏言。
     * visual 用于实时改变咖啡视觉。
     * =====================================================
     */

      beans: [
        {
          id: "yirgacheffe_light",

          }

        {
          id: "mandheling_dark",
          label: "深烘曼特宁",
          subtitle: "木质 / 微苦 / 醇厚",
          traits: ["dark", "bitter", "grounded"],
          visual: {
            liquidColor: "#3A241C",
            liquidOpacity: 0.96,
            cremaColor: "#A06A3B",
            moodColor: "rgba(83, 55, 43, 0.22)",
            liquidHeight: "70%"
          }
        },
        {
          id: "gesha_blend",
          label: "瑰夏拼配",
          subtitle: "优雅 / 茶感 / 层次",
          traits: ["elegant", "tea_like", "complex"],
          visual: {
            liquidColor: "#9A6744",
            liquidOpacity: 0.76,
            cremaColor: "#DFC08E",
            moodColor: "rgba(203, 178, 137, 0.25)",
            liquidHeight: "64%"
          }
        }
      ],

      methods: [
        {
          id: "pour_over",
          label: "手冲",
          subtitle: "缓慢 / 专注",
          traits: ["slow", "clear"],
          visual: {
            cupWidth: "118px",
            cupHeight: "168px",
            cupShape: "glass",
            liquidHeight: "62%",
            showCrema: false
          }
        },
        {
          id: "espresso",
          label: "意式浓缩",
          subtitle: "浓缩 / 直接",
          traits: ["intense", "direct"],
          visual: {
            cupWidth: "104px",
            cupHeight: "126px",
            cupShape: "espresso",
            liquidHeight: "54%",
            showCrema: true
          }
        },
        {
          id: "cold_brew",
          label: "冷萃",
          subtitle: "时间 / 沉淀",
          traits: ["cold_brew", "patient", "smooth"],
          visual: {
            cupWidth: "116px",
            cupHeight: "190px",
            cupShape: "tall",
            liquidHeight: "72%",
            liquidOpacity: 0.7,
            showCrema: false
          }
        },
        {
          id: "moka_pot",
          label: "摩卡壶",
          subtitle: "复古 / 生活感",
          traits: ["retro", "daily"],
          visual: {
            cupWidth: "116px",
            cupHeight: "150px",
            cupShape: "glass",
            liquidHeight: "65%",
            showCrema: true
          }
        }
      ],

      bases: [
        {
          id: "water",
          label: "纯净温水",
          subtitle: "本真 / 清澈",
          traits: ["pure", "minimal"],
          visual: {
            showMilk: false,
            showBubbles: false,
            liquidOpacity: 0.78
          }
        },
        {
          id: "oat_milk",
          label: "燕麦奶",
          subtitle: "柔和 / 包裹",
          traits: ["soft", "safe", "grain"],
          visual: {
            showMilk: true,
            milkColor: "#E6D6BE",
            liquidOpacity: 0.9,
            moodColor: "rgba(226, 210, 187, 0.34)"
          }
        },
        {
          id: "coconut_water",
          label: "椰青水",
          subtitle: "清透 / 解脱",
          traits: ["fresh", "clean"],
          visual: {
            showMilk: false,
            showBubbles: false,
            liquidOpacity: 0.62,
            moodColor: "rgba(207, 218, 201, 0.3)"
          }
        },
        {
          id: "sparkling",
          label: "气泡水",
          subtitle: "轻盈 / 释放",
          traits: ["sparkling", "release", "fresh"],
          visual: {
            showMilk: false,
            showBubbles: true,
            liquidOpacity: 0.58,
            moodColor: "rgba(216, 223, 218, 0.34)"
          }
        }
      ],

      accents: [
        {
          id: "none",
          label: "无需调味",
          subtitle: "保持本真",
          traits: ["pure"],
          visual: {
            topping: "none"
          }
        },
        {
          id: "osmanthus",
          label: "干桂花",
          subtitle: "微甜 / 秋意",
          traits: ["gentle", "warm", "autumn"],
          visual: {
            topping: "petals"
          }
        },
        {
          id: "sea_salt",
          label: "海盐",
          subtitle: "层次 / 克制",
          traits: ["restrained", "layered"],
          visual: {
            topping: "salt"
          }
        },
        {
          id: "citrus_peel",
          label: "橙皮",
          subtitle: "灵光 / 明朗",
          traits: ["citrus", "bright", "awake"],
          visual: {
            topping: "citrus"
          }
        }
      ],

      temperatures: [
        {
          id: "hot",
          label: "热",
          subtitle: "拥抱 / 安定",
          traits: ["hot", "calm", "comfort"],
          visual: {
            showSteam: true,
            showIce: false
          }
        },
        {
          id: "warm",
          label: "温热",
          subtitle: "平静 / 柔软",
          traits: ["warm", "soft", "stable"],
          visual: {
            showSteam: true,
            showIce: false
          }
        },
        {
          id: "light_ice",
          label: "微冰",
          subtitle: "清醒 / 克制",
          traits: ["cool", "restrained", "awake"],
          visual: {
            showSteam: false,
            showIce: true
          }
        },
        {
          id: "extra_ice",
          label: "极冰",
          subtitle: "释放 / 清透",
          traits: ["cold", "release", "clear"],
          visual: {
            showSteam: false,
            showIce: true,
            liquidOpacity: 0.66
          }
        }
      ]
    };

    /**
     * =====================================================
     * 2. 步骤配置
     * =====================================================
     */

    const steps = [
      {
        key: "beans",
        title: "选择今日豆子",
        desc: "先决定这杯咖啡的底色。明亮、沉稳，或柔和。"
      },
      {
        key: "methods",
        title: "选择萃取方式",
        desc: "不同的萃取，会改变咖啡的节奏与身体感。"
      },
      {
        key: "bases",
        title: "选择饮料基底",
        desc: "让咖啡与水、奶、气泡，发生一次安静的相遇。"
      },
      {
        key: "accents",
        title: "选择点睛风味",
        desc: "一点细微的风味，会决定今日情绪的尾音。"
      },
      {
        key: "temperatures",
        title: "选择温度状态",
        desc: "热饮像拥抱，冰饮像把窗打开。"
      }
    ];

    const state = {
      currentStep: 0,
      selections: {
        beans: null,
        methods: null,
        bases: null,
        accents: null,
        temperatures: null
      }
    };

    const defaultVisual = {
      liquidColor: "#6B4634",
      liquidOpacity: 0.86,
      milkColor: "#E7D8C2",
      cremaColor: "#C9965A",
      cupWidth: "118px",
      cupHeight: "168px",
      liquidHeight: "68%",
      moodColor: "rgba(139, 94, 60, 0.16)",

      cupShape: "glass",
      showCrema: false,
      showMilk: false,
      showBubbles: false,
      showSteam: false,
      showIce: false,
      topping: "none"
    };

    /**
     * =====================================================
     * 3. 初始化日期
     * =====================================================
     */

    function setTodayDate() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");

      const weekDays = [
        "SUNDAY",
        "MONDAY",
        "TUESDAY",
        "WEDNESDAY",
        "THURSDAY",
        "FRIDAY",
        "SATURDAY"
      ];

      document.getElementById("dateMain").textContent = `${year}.${month}.${day}`;
      document.getElementById("dateSub").textContent = weekDays[now.getDay()];
    }

    /**
     * =====================================================
     * 4. 页面切换
     * =====================================================
     */

    document.getElementById("startBtn").addEventListener("click", () => {
      document.getElementById("openingScreen").classList.add("hidden");
      document.getElementById("builderScreen").classList.remove("hidden");

      // 进入调配页时，默认选中每步第一个选项，避免空状态
      steps.forEach(step => {
        if (!state.selections[step.key]) {
          state.selections[step.key] = optionData[step.key][0];
        }
      });

      renderStep();
      updateCoffeeVisual();
    });

    /**
     * =====================================================
     * 5. 渲染步骤与选项
     * =====================================================
     */

    function renderStep() {
      const step = steps[state.currentStep];
      const options = optionData[step.key];

      document.getElementById("stepKicker").textContent =
        `Step ${String(state.currentStep + 1).padStart(2, "0")}`;

      document.getElementById("stepTitle").textContent = step.title;
      document.getElementById("stepDesc").textContent = step.desc;
      document.getElementById("stepCount").textContent =
        `${state.currentStep + 1} / ${steps.length}`;

      const grid = document.getElementById("optionGrid");
      grid.innerHTML = "";

      options.forEach(option => {
        const isActive = state.selections[step.key]?.id === option.id;

        const button = document.createElement("button");
        button.className = `option-card ${isActive ? "active" : ""}`;
        button.innerHTML = `
          <div class="option-label">${option.label}</div>
          <div class="option-subtitle">${option.subtitle}</div>
        `;

        button.addEventListener("click", () => {
          state.selections[step.key] = option;
          renderStep();
          updateCoffeeVisual();
        });

        grid.appendChild(button);
      });

      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");

      prevBtn.style.visibility = state.currentStep === 0 ? "hidden" : "visible";
      nextBtn.textContent = state.currentStep === steps.length - 1 ? "完成萃取" : "下一项";
    }

    document.getElementById("prevBtn").addEventListener("click", () => {
      if (state.currentStep > 0) {
        state.currentStep -= 1;
        renderStep();
      }
    });

    document.getElementById("nextBtn").addEventListener("click", () => {
      if (state.currentStep < steps.length - 1) {
        state.currentStep += 1;
        renderStep();
      } else {
        const resultTraits = collectTraits();
        console.log("当前选择：", state.selections);
        console.log("用于匹配结果的 traits：", resultTraits);
        alert("下一步将进入「今日咖啡谏言」结果卡片页。");
      }
    });

    /**
     * =====================================================
     * 6. 合并视觉配置
     * 每个选择的 visual 会叠加到最终视觉上。
     * 后面的选择可以覆盖前面的视觉属性。
     * =====================================================
     */

    function mergeVisual() {
      const merged = { ...defaultVisual };

      steps.forEach(step => {
        const selected = state.selections[step.key];
        if (selected && selected.visual) {
          Object.assign(merged, selected.visual);
        }
      });

      return merged;
    }

    function updateCoffeeVisual() {
      const visual = mergeVisual();

      const root = document.documentElement;
      const coffeeVisual = document.getElementById("coffeeVisual");
      const cup = document.getElementById("cup");

      root.style.setProperty("--liquid-color", visual.liquidColor);
      root.style.setProperty("--liquid-opacity", visual.liquidOpacity);
      root.style.setProperty("--milk-color", visual.milkColor);
      root.style.setProperty("--crema-color", visual.cremaColor);
      root.style.setProperty("--cup-width", visual.cupWidth);
      root.style.setProperty("--cup-height", visual.cupHeight);
      root.style.setProperty("--liquid-height", visual.liquidHeight);
      root.style.setProperty("--mood-color", visual.moodColor);

      coffeeVisual.classList.toggle("show-crema", !!visual.showCrema);
      coffeeVisual.classList.toggle("show-milk", !!visual.showMilk);
      coffeeVisual.classList.toggle("show-bubbles", !!visual.showBubbles);
      coffeeVisual.classList.toggle("show-steam", !!visual.showSteam);
      coffeeVisual.classList.toggle("show-ice", !!visual.showIce);

      coffeeVisual.classList.remove("show-petals", "show-salt", "show-citrus");

      if (visual.topping === "petals") {
        coffeeVisual.classList.add("show-petals");
      }

      if (visual.topping === "salt") {
        coffeeVisual.classList.add("show-salt");
      }

      if (visual.topping === "citrus") {
        coffeeVisual.classList.add("show-citrus");
      }

      cup.classList.remove("espresso", "tall");

      if (visual.cupShape === "espresso") {
        cup.classList.add("espresso");
      }

      if (visual.cupShape === "tall") {
        cup.classList.add("tall");
      }
    }

    /**
     * =====================================================
     * 7. 收集 traits
     * 后续用于匹配 adviceData。
     * =====================================================
     */

    function collectTraits() {
      const traits = [];

      steps.forEach(step => {
        const selected = state.selections[step.key];
        if (selected && Array.isArray(selected.traits)) {
          traits.push(...selected.traits);
        }
      });

      return [...new Set(traits)];
    }

    setTodayDate();
  </script>
</body>
</html>
