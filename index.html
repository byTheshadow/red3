<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>咖啡谏言 · Daily Coffee Whispers</title>

  <!-- 引入样式文件 -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/opening.css">
  <link rel="stylesheet" href="css/builder.css">
  <link rel="stylesheet" href="css/result.css">
</head>
<body>

  <div class="app-container">

    <!-- Screen 1: 开场页 -->
    <section class="screen opening-screen" id="openingScreen">
      <header class="date-header">
        <div class="date-main" id="dateMain">2026.08.20</div>
        <div class="date-sub" id="dateSub">THURSDAY</div>
      </header>

      <main class="canvas-stage">
        <div class="ink-bloom"></div>
        <svg class="ink-svg" viewBox="0 0 200 200">
          <circle class="drop" cx="100" cy="100" r="4.5"></circle>
          <circle class="ripple-1" cx="100" cy="100" r="40"></circle>
          <circle class="ripple-2" cx="100" cy="100" r="40"></circle>
        </svg>
      </main>

      <footer class="footer-action">
        <p class="whisper-subtitle">萃取今日的情绪<br>调配一杯专属谏言</p>
        <button class="primary-btn" id="startBtn">开启调配</button>
      </footer>
    </section>

    <!-- Screen 2: 调配页 -->
    <section class="screen builder-screen hidden" id="builderScreen">
      <header class="builder-top">
        <div>
          <div class="step-kicker" id="stepKicker">Step 01</div>
          <h1 class="step-title" id="stepTitle">选择今日豆子</h1>
          <p class="step-desc" id="stepDesc">先决定这杯咖啡的底色。</p>
        </div>
        <div class="step-count" id="stepCount">1 / 5</div>
      </header>

      <main class="coffee-stage">
        <div class="mood-orb"></div>
        <div class="coffee-visual" id="coffeeVisual">
          <div class="steam-wrap">
            <div class="steam steam-1"></div>
            <div class="steam steam-2"></div>
            <div class="steam steam-3"></div>
          </div>
          <div class="saucer"></div>
          <div class="cup" id="cup">
            <div class="liquid"></div>
            <div class="milk-layer"></div>
            <div class="crema"></div>
            <div class="ice ice-1"></div>
            <div class="ice ice-2"></div>
            <div class="ice ice-3"></div>
            <div class="bubble bubble-1"></div>
            <div class="bubble bubble-2"></div>
            <div class="bubble bubble-3"></div>
            <div class="topping"></div>
          </div>
        </div>
      </main>

      <footer class="options-panel">
        <div class="option-grid" id="optionGrid"></div>
        <div class="builder-nav">
          <button class="ghost-btn" id="prevBtn">上一项</button>
          <button class="next-btn" id="nextBtn">下一项</button>
        </div>
      </footer>
    </section>

    <!-- Screen 3: 结果卡片页 (Result) -->
    <section class="screen result-screen hidden" id="resultScreen">
      <div class="result-card">
        <div class="card-header">
          <div class="card-tag" id="resTag">接纳与沉淀</div>
          <div class="card-date" id="resDate">2026.08.20</div>
        </div>

        <h2 class="res-coffee-name" id="resCoffeeName">清晨的克制 · 桂花燕麦拿铁</h2>
        
        <div class="flavor-pills" id="resFlavorPills">
          <!-- 动态渲染风味标签 -->
        </div>

        <div class="divider"></div>

        <div class="quote-box">
          <span class="quote-mark">“</span>
          <p class="quote-text" id="resQuote">不必急于把生活填满，留白的地方，正好用来容纳晨光与偶然的风。</p>
        </div>

        <!-- 陪伴书籍推荐模块 -->
        <div class="book-card">
          <div class="book-label">今日推荐阅读</div>
          <div class="book-title" id="resBookTitle">《日日是好日》</div>
          <div class="book-author" id="resBookAuthor">森下典子</div>
          <p class="book-reason" id="resBookReason">在茶道与四季的微小起伏中，重新找回身体对时间的感知。</p>
        </div>

        <div class="card-footer">
          <div class="brand-signature">DAILY COFFEE WHISPERS</div>
          <div class="save-tip">截图保存今日灵感</div>
        </div>
      </div>

      <button class="re-tweak-btn" id="reStartBtn">重新调配</button>
    </section>

  </div>

  <!-- 引入 JS 文件 (按依赖顺序加载) -->
  <script src="js/data/options.js"></script>
  <script src="js/data/advice.js"></script>
  <script src="js/coffee-visual.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
